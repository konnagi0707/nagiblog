name: Sync Archive Data

on:
  workflow_dispatch:
  schedule:
    # Check every two hours, offset from the other archive workflow.
    - cron: "47 */2 * * *"

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.changes.outputs.changed }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Sync archive data
        run: |
          echo "Full sync: posts + member + history"
          python3 scripts/fetch_nagisa_blog.py \
            --output data/posts.json \
            --member-output data/member.json \
            --member-history-output data/member_history.json \
            --sleep 0.12 \
            --image-sleep 0.03

      - name: Commit and push meaningful changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -I '"updatedAt":' -- \
               data/posts.json data/member.json data/member_history.json data/images data/member && \
             test -z "$(git ls-files --others --exclude-standard -- data/images data/member)"; then
            git restore -- \
              data/posts.json data/member.json data/member_history.json data/images data/member
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No blog or profile changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/posts.json data/member.json data/member_history.json data/images data/member
          git commit -m "chore: sync archive data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: sync
    if: needs.sync.outputs.changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest archive
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare static files
        run: |
          mkdir -p dist
          cp index.html styles.css app.js portrait.jpeg portrait.png dist/
          cp -R data dist/data
          touch dist/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
